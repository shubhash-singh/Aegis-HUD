name: Release signed APK

on:
  push:
    branches:
      - production

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.AEGIS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AEGIS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AEGIS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AEGIS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AEGIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aegis-release.jks"
          chmod 600 "$RUNNER_TEMP/aegis-release.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build signed release APK
        env:
          AEGIS_RELEASE_STORE_FILE: ${{ runner.temp }}/aegis-release.jks
          AEGIS_RELEASE_STORE_PASSWORD: ${{ secrets.AEGIS_RELEASE_STORE_PASSWORD }}
          AEGIS_RELEASE_KEY_ALIAS: ${{ secrets.AEGIS_RELEASE_KEY_ALIAS }}
          AEGIS_RELEASE_KEY_PASSWORD: ${{ secrets.AEGIS_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PaegisVersionCode="$GITHUB_RUN_NUMBER" \
            -PaegisVersionName="0.1.0-production.$GITHUB_RUN_NUMBER"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-production-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Create release tag
        id: release_tag
        run: echo "tag=production-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "AEGIS production ${{ steps.release_tag.outputs.tag }}" \
            --generate-notes
